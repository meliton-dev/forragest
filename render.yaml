# Despliegue en Render (https://render.com): "New > Blueprint" y elegir este repositorio.
databases:
  - name: forragest-db
    plan: free
    databaseName: forragest
    user: forragest

services:
  - type: web
    name: forragest-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: forragest-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # URL de las apps, p. ej. https://forragest-repartos.onrender.com
      - key: SEED_PASSWORD
        sync: false

  - type: web
    name: forragest-repartos
    runtime: static
    buildCommand: npm ci && npm run build -w apps/driver
    staticPublishPath: ./apps/driver/dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    envVars:
      - key: VITE_API_URL
        sync: false # URL de forragest-api, p. ej. https://forragest-api.onrender.com
